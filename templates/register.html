<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>S’inscrire - MyLibrary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='logo.ico') }}">
      <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" href="static/logo.ico" type="image/x-icon">
<link rel="shortcut icon" href="static/logo.ico" type="image/x-icon">

    <link rel="stylesheet" href="/static/logo.ico">
</head>
<body class="bg-register">


<div class="container py-5">
  <h1 class="mb-4 text-center">Créer un compte MyLibrary</h1>

  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card">
        <div class="card-body">
          {% if error %}
          <div class="alert alert-danger">{{ error }}</div>
          {% endif %}
          <form method="POST" action="/register">
            <div class="mb-3">
              <label for="username" class="form-label">Nom d’utilisateur</label>
              <input type="text" class="form-control" name="username" id="username" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Mot de passe</label>
              <input type="password" class="form-control" name="password" id="password" required>
            </div>
            <div class="mb-3">
              <label for="confirm_password" class="form-label">Confirmer le mot de passe</label>
              <input type="password" class="form-control" name="confirm_password" id="confirm_password" required>
            </div>
            <button type="submit" class="btn btn-success w-100">S’inscrire</button>
          </form>
        </div>
      </div>
      <p class="mt-3 text-center card-footer">
    Déjà un compte ?
    <a href="{{ url_for('login') }}" class="btn btn-outline-light btn-victorian">Se connecter</a>
</p>


    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="/static/styles.css">
</body>
</html>
